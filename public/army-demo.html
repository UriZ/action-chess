<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Armies — Both Sides, Live</title>
<style>
  :root { --red: #a31f2b; --parchment: #e9e4d5; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #07080c;
    color: var(--parchment);
    font-family: Georgia, 'Times New Roman', serif;
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  h1 { margin-top: 8px; font-size: 16px; letter-spacing: 6px; font-weight: normal; text-transform: uppercase; color: #7d8195; }
  h1 b { color: var(--red); font-weight: normal; }

  #stage {
    position: relative;
    width: min(98vw, 1600px);
    flex: 1;
    max-height: 78vh;
    margin-top: 4px;
    border: 1px solid #1d1f28;
    border-radius: 6px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 140% 55% at 50% 118%, #161925 0%, transparent 55%),
      linear-gradient(#05060a 0%, #0a0c14 50%, #10121c 100%);
  }
  #stage::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 88% 78% at 50% 48%, transparent 52%, rgba(0,0,0,0.6) 100%);
    pointer-events: none; z-index: 20;
  }
  #moon {
    position: absolute; left: 50%; top: 16%;
    width: 200px; height: 200px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 42% 38%, #f4f1e4 0%, #d9d4c2 45%, #b9b4a4 72%, #a19c8e 100%);
    box-shadow: 0 0 70px 22px rgba(233, 228, 213, 0.09);
    opacity: 0.42;
  }
  #shaker { position: absolute; inset: 0; }
  #camera { position: absolute; inset: 0; will-change: transform; }
  #vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 66% 56% at 50% 52%, transparent 36%, rgba(0,0,0,0.82) 100%);
    opacity: 0; pointer-events: none; z-index: 15;
  }

  /* two ranks of ground, far (black army) and near (white army) */
  .rank-floor {
    position: absolute; left: 0; right: 0;
    background: linear-gradient(#1b1e27, #10121c);
    border-top: 2px solid #272a38;
  }
  #floorFar  { bottom: 46%; height: 56px; opacity: 0.85; }
  #floorNear { bottom: 0;  height: 96px; }
  .tile { position: absolute; border: 1px solid #2e3243; }
  .tile.alt { filter: brightness(0.78); }

  .actor {
    position: absolute;
    transform: translateX(var(--x, 0px));
    will-change: transform;
    cursor: pointer;
  }
  .actor .proot {
    width: 100%; height: 100%;
    transform-origin: 50% 98%;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .actor img {
    max-width: 100%; max-height: 100%;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,0.7));
    pointer-events: none;
  }
  .actor::after {
    content: '';
    position: absolute; left: 50%; bottom: -10px;
    width: 52%; height: 16px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(0,0,0,0.6) 0%, transparent 70%);
  }
  .actor.sel::before {
    content: '';
    position: absolute; left: 50%; bottom: -14px;
    width: 68%; height: 22px;
    transform: translateX(-50%);
    border: 2px solid rgba(163,31,43,0.9);
    border-radius: 50%;
    box-shadow: 0 0 14px rgba(163,31,43,0.5);
  }
  .actor.target::before {
    content: '';
    position: absolute; left: 50%; bottom: -14px;
    width: 68%; height: 22px;
    transform: translateX(-50%);
    border: 2px dashed rgba(233,228,213,0.75);
    border-radius: 50%;
  }
  .actor.gone { pointer-events: none; }

  @keyframes standeeBreath {
    0%, 100% { transform: scaleY(1) scaleX(1); }
    44%      { transform: scaleY(1.011) scaleX(0.998); }
    58%      { transform: scaleY(1.011) scaleX(0.998); }
  }
  .actor.idling .proot { animation: standeeBreath 3.4s ease-in-out infinite; }

  #fx { position: absolute; inset: 0; pointer-events: none; z-index: 14; }
  .dust { position: absolute; width: 10px; height: 10px; border-radius: 50%;
          background: radial-gradient(circle, rgba(170,165,150,0.5), transparent 70%); }
  .ember { position: absolute; width: 5px; height: 5px; border-radius: 50%;
           background: radial-gradient(circle, #e9e4d5, #a31f2b 70%, transparent); }

  #controls { display: flex; gap: 7px; padding: 10px 0 4px; flex-wrap: wrap; justify-content: center; }
  button {
    font-family: inherit; font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--parchment); background: #1b1d26;
    border: 1px solid #3a3d4e; border-bottom: 2px solid var(--red);
    padding: 8px 15px; cursor: pointer; border-radius: 3px;
  }
  button:hover { background: #262935; }
  button:disabled { opacity: 0.32; cursor: default; }
  #status { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #6b6f80; padding-bottom: 6px; min-height: 15px; text-align: center; }
</style>
</head>
<body>
<h1>The Armies <b>✠</b> Both Sides</h1>

<div id="stage">
  <div id="shaker">
    <div id="camera">
      <div id="moon"></div>
      <div class="rank-floor" id="floorFar"></div>
      <div class="rank-floor" id="floorNear"></div>
      <div id="fx"></div>
    </div>
    <div id="vignette"></div>
  </div>
</div>

<div id="controls">
  <button id="btnWalkL">◀ Walk</button>
  <button id="btnWalkR">Walk ▶</button>
  <button id="btnAttack">Attack</button>
  <button id="btnDeath">Death</button>
  <button id="btnDuel">Duel: pick a victim</button>
  <button id="btnMarch">March All</button>
  <button id="btnReset">Reset</button>
</div>
<div id="status">click any piece to select it</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage'), camera = $('camera'), shaker = $('shaker');
  const vignette = $('vignette'), fx = $('fx');
  const statusEl = $('status');
  const stageW = () => stage.clientWidth;
  const stageH = () => stage.clientHeight;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const setStatus = s => statusEl.textContent = s;
  const anim = (el, frames, duration, easing = 'ease-in-out') =>
    el.animate(frames, { duration, easing, fill: 'forwards' }).finished;

  function layTiles() {
    for (const [id, tw, th] of [['floorFar', 150, 30], ['floorNear', 190, 48]]) {
      const f = $(id);
      f.querySelectorAll('.tile').forEach(t => t.remove());
      const n = Math.ceil(stageW() / tw) + 1;
      for (let i = 0; i < n; i++) {
        const t = document.createElement('div');
        t.className = 'tile' + (i % 2 ? ' alt' : '');
        t.style.cssText = `left:${i*tw-20}px;bottom:${id==='floorFar'?14:26}px;width:${tw}px;height:${th}px;transform:skewX(-18deg);background:linear-gradient(#20232f,#171923)`;
        f.appendChild(t);
      }
    }
  }
  layTiles();
  addEventListener('resize', () => { layTiles(); layout(); });

  /* ---- synth sfx ---- */
  let AC = null, noiseBuf = null;
  function ac() {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function noise(dur, type, f0, f1, vol, t0 = 0) {
    const c = ac(), t = c.currentTime + t0;
    const s = c.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = c.createBiquadFilter(); f.type = type;
    f.frequency.setValueAtTime(f0, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(f1, 30), t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f).connect(g).connect(c.destination);
    s.start(t); s.stop(t + dur + 0.05);
  }
  function tone(dur, type, f0, f1, vol, t0 = 0) {
    const c = ac(), t = c.currentTime + t0;
    const o = c.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 20), t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  const sfx = {
    step(h) { noise(0.1, 'lowpass', h ? 330 : 430, 95, 0.14); tone(0.08, 'sine', h ? 62 : 76, 42, 0.09); },
    whoosh(d = 0.22, v = 0.22) { noise(d, 'bandpass', 2400, 300, v); },
    clang() { [740, 1180, 1870].forEach((f, i) => tone(0.28 - i * 0.05, 'triangle', f, f * 0.96, 0.09));
              noise(0.05, 'highpass', 4000, 3000, 0.14); },
    thud() { tone(0.16, 'sine', 120, 45, 0.36); noise(0.08, 'lowpass', 300, 90, 0.22); },
    bodyfall() { tone(0.22, 'sine', 95, 38, 0.42); noise(0.14, 'lowpass', 260, 70, 0.28); },
    death() { tone(0.9, 'sine', 160, 38, 0.22); noise(0.7, 'lowpass', 800, 60, 0.11, 0.1); }
  };

  function dustAt(cx, cy, n = 5, spread = 55) {
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div');
      d.className = 'dust';
      d.style.left = (cx + (Math.random() * spread - spread / 2)) + 'px';
      d.style.bottom = (cy + Math.random() * 10) + 'px';
      fx.appendChild(d);
      d.animate([
        { transform: 'translate(0,0) scale(0.6)', opacity: 0.75 },
        { transform: `translate(${(Math.random()-0.5)*60}px,-${18 + Math.random()*22}px) scale(${1.5+Math.random()})`, opacity: 0 }
      ], { duration: 480 + Math.random() * 300, easing: 'ease-out' }).onfinish = () => d.remove();
    }
  }
  function embersAt(cx, cy, n = 22) {
    for (let i = 0; i < n; i++) {
      const e = document.createElement('div');
      e.className = 'ember';
      e.style.left = (cx - 50 + Math.random() * 100) + 'px';
      e.style.bottom = (cy + Math.random() * 180) + 'px';
      fx.appendChild(e);
      e.animate([
        { transform: 'translate(0,0)', opacity: 1 },
        { transform: `translate(${(Math.random()-0.5)*45}px,-${55 + Math.random()*120}px)`, opacity: 0 }
      ], { duration: 950 + Math.random() * 900, easing: 'ease-out', delay: Math.random() * 400 }).onfinish = () => e.remove();
    }
  }
  function shake(i = 7, dur = 260) {
    const fr = [];
    for (let k = 0; k < 8; k++) {
      const d = 1 - k / 8;
      fr.push({ transform: `translate(${(Math.random()-0.5)*2*i*d}px, ${(Math.random()-0.5)*2*i*d}px)` });
    }
    fr.push({ transform: 'translate(0,0)' });
    shaker.animate(fr, { duration: dur, easing: 'linear' });
  }

  /* ---------------- pieces ----------------
     Sizes follow the display-scale contract in
     .claude/skills/piece-forge/SKILL.md (ratios vs the king).            */
  const P = n => `pieces/${n}`;
  const DEFS = [
    { key: 'pawn',   w: 240, h: 340, heavy: false },
    { key: 'rook',   w: 265, h: 360, heavy: true  },
    { key: 'knight', w: 350, h: 400, heavy: true  },
    { key: 'bishop', w: 255, h: 370, heavy: false },
    { key: 'queen',  w: 265, h: 385, heavy: false },
    { key: 'king',   w: 285, h: 400, heavy: true  }
  ];
  // the far rank reads as distance: smaller and raised
  const FAR_SCALE = 0.72;

  function makeArmy(color, far) {
    return DEFS.map((def, i) => {
      const s = far ? FAR_SCALE : 1;
      const el = document.createElement('div');
      el.className = 'actor idling';
      el.style.width = Math.round(def.w * s) + 'px';
      el.style.height = Math.round(def.h * s) + 'px';
      el.style.bottom = far ? '46%' : '64px';
      el.style.zIndex = far ? 2 + i : 8 + i;
      const root = document.createElement('div');
      root.className = 'proot';
      const img = document.createElement('img');
      img.src = P(`${color}-${def.key}.png`);
      img.draggable = false;
      root.appendChild(img);
      el.appendChild(root);
      camera.appendChild(el);
      const p = {
        ...def, color, far, el, root, img,
        name: `${color} ${def.key}`,
        idle: P(`${color}-${def.key}.png`),
        walk: [0,1,2,3].map(n => P(`${color}-${def.key}-walk-${n}.png`)),
        attack: [0,1,2,3].map(n => P(`${color}-${def.key}-attack-${n}.png`)),
        death: [0,1,2,3].map(n => P(`${color}-${def.key}-death-${n}.png`)),
        W: Math.round(def.w * s),
        x: 0, dead: false, busy: false,
        setX(v) { p.x = v; el.style.setProperty('--x', v + 'px'); },
        center() { return p.x + p.W / 2; },
        footY() { return far ? stageH() * 0.46 : 64; },
        face(d) { img.style.transform = d === 1 ? '' : 'scaleX(-1)'; },
        clear() { [root, el].forEach(n => n.getAnimations().forEach(a => a.cancel())); }
      };
      [...p.walk, ...p.attack, ...p.death].forEach(src => { const im = new Image(); im.src = src; });
      el.onclick = () => onPieceClick(p);
      return p;
    });
  }

  const black = makeArmy('black', true);   // far rank
  const white = makeArmy('white', false);  // near rank
  const all = [...black, ...white];

  function layout() {
    for (const army of [black, white]) {
      const gap = stageW() / (army.length + 1);
      army.forEach((p, i) => p.setX(Math.round(gap * (i + 1) - p.W / 2)));
    }
  }
  layout();

  /* ---------------- selection ---------------- */
  let selected = null, duelMode = false, busy = false;

  function onPieceClick(p) {
    if (busy || p.dead) return;
    if (duelMode && selected && p.color !== selected.color) {
      const atk = selected;
      duelMode = false;
      clearMarks();
      run(() => capture(atk, p));
      return;
    }
    selected = p;
    duelMode = false;
    clearMarks();
    p.el.classList.add('sel');
    setStatus(`${p.name} selected`);
    refresh();
  }
  function clearMarks() { all.forEach(q => q.el.classList.remove('sel', 'target')); }
  function refresh() {
    const live = selected && !selected.dead;
    for (const id of ['btnWalkL','btnWalkR','btnAttack','btnDeath']) $(id).disabled = busy || !live;
    $('btnDuel').disabled = busy || !live || all.filter(q => !q.dead && q.color !== selected?.color).length === 0;
    $('btnMarch').disabled = busy;
  }
  async function run(fn) {
    if (busy) return;
    busy = true; refresh();
    try { await fn(); } finally { busy = false; refresh(); }
  }

  /* ---------------- animations ---------------- */
  async function walkBy(p, dx, { quiet = false } = {}) {
    const dir = Math.sign(dx) || 1;
    const target = Math.max(4, Math.min(stageW() - p.W - 4, p.x + dx));
    if (Math.abs(target - p.x) < 8) return;
    const frameMs = p.heavy ? 150 : 120;
    const dur = Math.max(480, Math.abs(target - p.x) * (p.heavy ? 3.5 : 2.9));
    p.el.classList.remove('idling');
    p.face(dir);
    let fi = 0;
    p.img.src = p.walk[0];
    if (!quiet) sfx.step(p.heavy);
    const stepper = setInterval(() => {
      fi = (fi + 1) % 4;
      p.img.src = p.walk[fi];
      if (fi === 0 || fi === 2) {
        dustAt(p.center() - dir * 14, p.footY(), 2, 38);
        if (!quiet) sfx.step(p.heavy);
      }
    }, frameMs);
    p.root.animate([
      { transform: 'translateY(0)' }, { transform: 'translateY(-3px)' }, { transform: 'translateY(0)' }
    ], { duration: frameMs * 2, iterations: Math.ceil(dur / (frameMs * 2)), easing: 'ease-in-out' });
    await anim(p.el, [
      { transform: `translateX(${p.x}px)` }, { transform: `translateX(${target}px)` }
    ], dur, 'cubic-bezier(.2,.05,.8,.95)');
    p.setX(target);
    p.img.src = p.idle;
    p.face(1);
    if (!quiet) { sfx.thud(); dustAt(p.center(), p.footY(), 4); }
    await anim(p.root, [{ transform: 'scaleY(0.95) scaleX(1.03)' }, { transform: 'none' }], 180, 'ease-out');
    p.clear(); p.setX(target);
    p.el.classList.add('idling');
  }

  async function attackAir(p) {
    const dir = p.center() < stageW() / 2 ? 1 : -1;
    p.el.classList.remove('idling');
    p.face(dir);
    camera.style.transformOrigin = `${(p.center()/stageW())*100}% 68%`;
    p.img.src = p.attack[0]; sfx.whoosh(0.18, 0.1);
    await sleep(210);
    p.img.src = p.attack[1]; sfx.whoosh(0.3, 0.14);
    anim(p.el, [{ transform: `translateX(${p.x}px)` }, { transform: `translateX(${p.x - 15*dir}px)` }], 230, 'ease-out');
    await sleep(370);
    p.img.src = p.attack[2]; sfx.whoosh(0.15, 0.3);
    vignette.animate([{ opacity: 0 }, { opacity: 0.4, offset: 0.35 }, { opacity: 0 }], { duration: 720, easing: 'ease-out' });
    camera.animate([
      { transform: 'scale(1)' }, { transform: 'scale(1.05)', offset: 0.35 },
      { transform: 'scale(1.05)', offset: 0.7 }, { transform: 'scale(1)' }
    ], { duration: 720, easing: 'cubic-bezier(.2,.9,.3,1)' });
    anim(p.el, [{ transform: `translateX(${p.x - 15*dir}px)` }, { transform: `translateX(${p.x + 66*dir}px)` }], 170, 'cubic-bezier(.3,.9,.3,1)');
    setTimeout(() => { sfx.clang(); sfx.thud(); shake(11, 290); dustAt(p.center() + 80*dir, p.footY(), 8); }, 110);
    await sleep(195);
    p.img.src = p.attack[3];
    await sleep(300);
    p.img.src = p.idle;
    await anim(p.el, [{ transform: `translateX(${p.x + 66*dir}px)` }, { transform: `translateX(${p.x}px)` }], 250, 'ease-in-out');
    p.face(1); p.clear(); p.setX(p.x);
    p.el.classList.add('idling');
  }

  async function die(p, { quiet = false } = {}) {
    p.el.classList.remove('idling');
    p.dead = true;
    p.el.classList.remove('sel', 'target');
    if (!quiet) { sfx.clang(); sfx.death(); }
    p.img.src = p.death[0];
    p.root.animate([
      { filter: 'brightness(1)' }, { filter: 'brightness(2.3) contrast(1.2)' }, { filter: 'brightness(1)' }
    ], { duration: 190, easing: 'ease-out' });
    if (!quiet) shake(6, 210);
    await sleep(380);
    p.img.src = p.death[1];
    await sleep(410);
    p.img.src = p.death[2];
    await sleep(230);
    p.img.src = p.death[3];
    sfx.bodyfall(); shake(8, 240); dustAt(p.center(), p.footY(), 9);
    await sleep(850);
    embersAt(p.center(), p.footY());
    await anim(p.root, [
      { opacity: 1, filter: 'brightness(0.95)' }, { opacity: 0, filter: 'brightness(0.55)' }
    ], 1150, 'ease-in');
    p.el.classList.add('gone');
  }

  /* the real thing: one piece crosses the field and kills another */
  async function capture(atk, vic) {
    setStatus(`${atk.name} takes ${vic.name}`);
    const sameRank = atk.far === vic.far;
    const dir = Math.sign(vic.center() - atk.center()) || 1;
    // stand just short of the victim (on their rank's x, our own rank's y)
    const approach = vic.center() - dir * (atk.W / 2 + 120) - atk.W / 2;
    await walkBy(atk, approach - atk.x);

    atk.el.classList.remove('idling');
    atk.face(dir);
    atk.el.style.zIndex = 30;
    camera.style.transformOrigin = `${(vic.center()/stageW())*100}% 64%`;

    atk.img.src = atk.attack[0]; sfx.whoosh(0.18, 0.1);
    await sleep(210);
    atk.img.src = atk.attack[1]; sfx.whoosh(0.3, 0.14);
    anim(atk.el, [{ transform: `translateX(${atk.x}px)` }, { transform: `translateX(${atk.x - 16*dir}px)` }], 230, 'ease-out');
    await sleep(380);

    atk.img.src = atk.attack[2]; sfx.whoosh(0.15, 0.32);
    vignette.animate([
      { opacity: 0 }, { opacity: 0.5, offset: 0.3 }, { opacity: 0.45, offset: 0.7 }, { opacity: 0 }
    ], { duration: 880, easing: 'ease-out' });
    camera.animate([
      { transform: 'scale(1)' }, { transform: 'scale(1.07)', offset: 0.3 },
      { transform: 'scale(1.07)', offset: 0.7 }, { transform: 'scale(1)' }
    ], { duration: 880, easing: 'cubic-bezier(.2,.9,.3,1)' });
    anim(atk.el, [{ transform: `translateX(${atk.x - 16*dir}px)` }, { transform: `translateX(${atk.x + 74*dir}px)` }], 175, 'cubic-bezier(.3,.9,.3,1)');
    setTimeout(() => {
      sfx.clang(); sfx.thud(); shake(13, 320);
      dustAt(vic.center(), vic.footY(), 9);
    }, 115);
    await sleep(200);

    atk.img.src = atk.attack[3];
    const victimDies = die(vic, { quiet: true });
    await sleep(330);
    atk.img.src = atk.idle;
    anim(atk.el, [{ transform: `translateX(${atk.x + 74*dir}px)` }, { transform: `translateX(${atk.x}px)` }], 280, 'ease-in-out')
      .then(() => { atk.face(1); atk.clear(); atk.setX(atk.x); atk.el.style.zIndex = ''; atk.el.classList.add('idling'); });
    await victimDies;
    setStatus(`${vic.name} has fallen`);
  }

  /* ---------------- controls ---------------- */
  $('btnWalkL').onclick = () => run(() => walkBy(selected, -210));
  $('btnWalkR').onclick = () => run(() => walkBy(selected, 210));
  $('btnAttack').onclick = () => run(() => attackAir(selected));
  $('btnDeath').onclick  = () => run(() => die(selected));
  $('btnDuel').onclick = () => {
    if (!selected || selected.dead) return;
    duelMode = true;
    clearMarks();
    selected.el.classList.add('sel');
    all.filter(q => !q.dead && q.color !== selected.color).forEach(q => q.el.classList.add('target'));
    setStatus(`choose a victim for the ${selected.name}`);
  };
  $('btnMarch').onclick = () => run(async () => {
    setStatus('the armies march');
    const live = all.filter(p => !p.dead);
    await Promise.all(live.map((p, i) =>
      sleep(i * 110).then(() => walkBy(p, (p.color === 'white' ? 1 : -1) * 150, { quiet: i > 2 }))
    ));
    setStatus('the armies hold');
  });
  $('btnReset').onclick = () => {
    if (busy) return;
    for (const p of all) {
      p.clear(); p.dead = false;
      p.img.src = p.idle; p.face(1);
      p.root.style.filter = ''; p.root.style.opacity = '';
      p.el.style.zIndex = '';
      p.el.classList.remove('gone', 'sel', 'target');
      p.el.classList.add('idling');
    }
    layout();
    selected = null; duelMode = false;
    setStatus('click any piece to select it');
    refresh();
  };
  refresh();
})();
</script>
</body>
</html>
