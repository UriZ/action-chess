<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Duel — King vs Pawn</title>
<style>
  :root { --red: #a31f2b; --parchment: #e9e4d5; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #07080c;
    color: var(--parchment);
    font-family: Georgia, 'Times New Roman', serif;
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  h1 { margin-top: 12px; font-size: 18px; letter-spacing: 6px; font-weight: normal; text-transform: uppercase; color: #7d8195; }
  h1 b { color: var(--red); font-weight: normal; }

  #stage {
    position: relative;
    width: min(96vw, 1100px);
    flex: 1;
    max-height: 76vh;
    margin-top: 8px;
    border: 1px solid #1d1f28;
    border-radius: 6px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 140% 55% at 50% 115%, #161925 0%, transparent 55%),
      linear-gradient(#05060a 0%, #0a0c14 50%, #10121c 100%);
  }
  #stage::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle 1px at 12% 18%, rgba(233,228,213,0.5) 0 1px, transparent 2px),
      radial-gradient(circle 1px at 78% 12%, rgba(233,228,213,0.4) 0 1px, transparent 2px),
      radial-gradient(circle 1px at 56% 28%, rgba(233,228,213,0.35) 0 1px, transparent 2px),
      radial-gradient(circle 1px at 34% 9%,  rgba(233,228,213,0.4) 0 1px, transparent 2px),
      radial-gradient(circle 1px at 90% 32%, rgba(233,228,213,0.3) 0 1px, transparent 2px);
  }
  #stage::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 80% 70% at 50% 45%, transparent 48%, rgba(0,0,0,0.7) 100%);
    pointer-events: none; z-index: 6;
  }
  #moon {
    position: absolute;
    left: 50%; top: 30%;
    width: 300px; height: 300px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 42% 38%, #f4f1e4 0%, #d9d4c2 45%, #b9b4a4 72%, #a19c8e 100%);
    box-shadow: 0 0 90px 30px rgba(233, 228, 213, 0.1);
    opacity: 0.55;
  }
  #shaker { position: absolute; inset: 0; }
  #camera { position: absolute; inset: 0; will-change: transform; }
  #vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 68% 58% at 50% 52%, transparent 38%, rgba(0,0,0,0.8) 100%);
    opacity: 0; pointer-events: none; z-index: 5;
  }
  #ground {
    position: absolute; left: 0; right: 0; bottom: 0; height: 110px;
    background: linear-gradient(#1d2029, #111320);
    border-top: 2px solid #272a38;
  }
  .tile {
    position: absolute; bottom: 30px; width: 170px; height: 52px;
    transform: skewX(-18deg);
    border: 1px solid #2e3243;
    background: linear-gradient(#20232f, #171923);
  }
  .tile.alt { background: linear-gradient(#171923, #10121b); }

  .actor {
    position: absolute;
    bottom: 76px;
    left: 0;
    transform: translateX(var(--x, 0px));
    will-change: transform;
  }
  .actor .proot {
    width: 100%; height: 100%;
    transform-origin: 50% 98%;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .actor img {
    max-width: 100%; max-height: 100%;
    filter: drop-shadow(0 10px 14px rgba(0,0,0,0.65));
    pointer-events: none;
  }
  .actor::after {
    content: '';
    position: absolute;
    left: 50%; bottom: -14px;
    width: 55%; height: 22px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(0,0,0,0.6) 0%, transparent 70%);
  }
  @keyframes standeeBreath {
    0%, 100% { transform: scaleY(1) scaleX(1); }
    44%      { transform: scaleY(1.011) scaleX(0.998); }
    58%      { transform: scaleY(1.011) scaleX(0.998); }
  }
  .actor.idling .proot { animation: standeeBreath 3.4s ease-in-out infinite; }

  #fx { position: absolute; inset: 0; pointer-events: none; }
  .dust { position: absolute; width: 11px; height: 11px; border-radius: 50%;
          background: radial-gradient(circle, rgba(170,165,150,0.5), transparent 70%); }
  .ember { position: absolute; width: 5px; height: 5px; border-radius: 50%;
           background: radial-gradient(circle, #e9e4d5, #a31f2b 70%, transparent); }

  #controls { display: flex; gap: 10px; padding: 14px 0 8px; flex-wrap: wrap; justify-content: center; }
  button {
    font-family: inherit; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--parchment); background: #1b1d26;
    border: 1px solid #3a3d4e; border-bottom: 2px solid var(--red);
    padding: 9px 18px; cursor: pointer; border-radius: 3px;
  }
  button:hover { background: #262935; }
  button:disabled { opacity: 0.35; cursor: default; }
  #status { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: #6b6f80; padding-bottom: 10px; min-height: 16px; }
</style>
</head>
<body>
<h1>The Duel <b>✠</b> King vs Pawn</h1>

<div id="stage">
  <div id="shaker">
    <div id="camera">
      <div id="moon"></div>
      <div id="ground"></div>
      <div id="fx"></div>
    </div>
    <div id="vignette"></div>
  </div>
</div>

<div id="controls">
  <button id="btnPawnWalk">Pawn Walk</button>
  <button id="btnKingWalk">King Walk</button>
  <button id="btnPawnTakes">Pawn Takes King</button>
  <button id="btnKingTakes">King Takes Pawn</button>
  <button id="btnReset">Reset</button>
</div>
<div id="status">two pieces, one square</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage'), camera = $('camera'), shaker = $('shaker');
  const vignette = $('vignette'), fx = $('fx'), ground = $('ground');
  const statusEl = $('status');
  const buttons = [...document.querySelectorAll('#controls button')];
  const stageW = () => stage.clientWidth;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const setStatus = s => statusEl.textContent = s;

  function layTiles() {
    ground.querySelectorAll('.tile').forEach(t => t.remove());
    const n = Math.ceil(stageW() / 170) + 1;
    for (let i = 0; i < n; i++) {
      const t = document.createElement('div');
      t.className = 'tile' + (i % 2 ? ' alt' : '');
      t.style.left = (i * 170 - 24) + 'px';
      ground.appendChild(t);
    }
  }
  layTiles();
  addEventListener('resize', layTiles);

  /* ---------------- sfx (synth, no assets) ---------------- */
  let AC = null, noiseBuf = null;
  function ac() {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function noise(dur, type, f0, f1, vol, t0 = 0) {
    const c = ac(), t = c.currentTime + t0;
    const s = c.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = c.createBiquadFilter(); f.type = type;
    f.frequency.setValueAtTime(f0, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(f1, 30), t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f).connect(g).connect(c.destination);
    s.start(t); s.stop(t + dur + 0.05);
  }
  function tone(dur, type, f0, f1, vol, t0 = 0) {
    const c = ac(), t = c.currentTime + t0;
    const o = c.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 20), t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  const sfx = {
    step(heavy)  { noise(0.11, 'lowpass', heavy ? 330 : 430, 95, 0.2); tone(0.09, 'sine', heavy ? 60 : 76, 42, 0.12); },
    whoosh(d = 0.22, v = 0.22) { noise(d, 'bandpass', 2400, 300, v); },
    clang()  { [740, 1180, 1870].forEach((f, i) => tone(0.28 - i * 0.05, 'triangle', f, f * 0.96, 0.10));
               noise(0.05, 'highpass', 4000, 3000, 0.16); },
    thud()   { tone(0.16, 'sine', 120, 45, 0.4); noise(0.08, 'lowpass', 300, 90, 0.25); },
    bodyfall(){ tone(0.22, 'sine', 95, 38, 0.45); noise(0.14, 'lowpass', 260, 70, 0.3); },
    sting()  { tone(0.22, 'sawtooth', 160, 640, 0.07); noise(0.25, 'bandpass', 900, 3400, 0.16); },
    death()  { tone(0.9, 'sine', 160, 38, 0.25); noise(0.7, 'lowpass', 800, 60, 0.12, 0.1); }
  };

  /* ---------------- particles / camera ---------------- */
  function dustAt(cx, count = 6, spread = 70) {
    for (let i = 0; i < count; i++) {
      const d = document.createElement('div');
      d.className = 'dust';
      d.style.left = (cx + (Math.random() * spread - spread / 2)) + 'px';
      d.style.bottom = (66 + Math.random() * 12) + 'px';
      fx.appendChild(d);
      const dx = (Math.random() - 0.5) * 70;
      d.animate([
        { transform: 'translate(0,0) scale(0.6)', opacity: 0.8 },
        { transform: `translate(${dx}px,-${22 + Math.random() * 28}px) scale(${1.7 + Math.random()})`, opacity: 0 }
      ], { duration: 520 + Math.random() * 320, easing: 'ease-out' }).onfinish = () => d.remove();
    }
  }
  function embersAt(cx, count = 26) {
    for (let i = 0; i < count; i++) {
      const e = document.createElement('div');
      e.className = 'ember';
      e.style.left = (cx - 60 + Math.random() * 120) + 'px';
      e.style.bottom = (76 + Math.random() * 220) + 'px';
      fx.appendChild(e);
      e.animate([
        { transform: 'translate(0,0)', opacity: 1 },
        { transform: `translate(${(Math.random() - 0.5) * 50}px,-${70 + Math.random() * 140}px)`, opacity: 0 }
      ], { duration: 1000 + Math.random() * 1000, easing: 'ease-out', delay: Math.random() * 450 }).onfinish = () => e.remove();
    }
  }
  function shake(intensity = 7, dur = 260) {
    const frames = [];
    for (let i = 0; i < 8; i++) {
      const k = 1 - i / 8;
      frames.push({ transform: `translate(${(Math.random()-0.5)*2*intensity*k}px, ${(Math.random()-0.5)*2*intensity*k}px)` });
    }
    frames.push({ transform: 'translate(0,0)' });
    shaker.animate(frames, { duration: dur, easing: 'linear' });
  }

  /* ---------------- pieces ---------------- */
  function makePiece({ name, w, h, startX, idle, walk, attack, death, heavy }) {
    const el = document.createElement('div');
    el.className = 'actor idling';
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    const root = document.createElement('div');
    root.className = 'proot';
    const img = document.createElement('img');
    img.src = idle;
    img.draggable = false;
    root.appendChild(img);
    el.appendChild(root);
    camera.appendChild(el);
    [idle, ...walk, ...attack, ...death].forEach(s => { const i = new Image(); i.src = s; });
    const p = {
      name, w, h, el, root, img, idle, walk, attack, death, heavy,
      x: startX, dead: false,
      setX(v) { p.x = v; el.style.setProperty('--x', v + 'px'); },
      center() { return p.x + w / 2; },
      face(dir) { img.style.transform = dir === 1 ? '' : 'scaleX(-1)'; },
      clear() { [root, el].forEach(n => n.getAnimations().forEach(a => a.cancel())); }
    };
    p.setX(startX);
    return p;
  }

  const anim = (el, frames, duration, easing = 'ease-in-out') =>
    el.animate(frames, { duration, easing, fill: 'forwards' }).finished;

  /* walk: frame cycle + slide */
  async function walkBy(p, dx) {
    const dir = Math.sign(dx) || 1;
    const target = Math.max(10, Math.min(stageW() - p.w - 10, p.x + dx));
    const frameMs = p.heavy ? 150 : 120;
    const dur = Math.max(600, Math.abs(target - p.x) * (p.heavy ? 3.7 : 3.0));
    p.el.classList.remove('idling');
    p.face(dir);
    let fi = 0;
    p.img.src = p.walk[0];
    sfx.step(p.heavy);
    const t0 = performance.now();
    const stepper = setInterval(() => {
      fi = (fi + 1) % 4;
      p.img.src = p.walk[fi];
      if (fi === 0 || fi === 2) {
        const prog = Math.min(1, (performance.now() - t0) / dur);
        dustAt(p.x + p.w / 2 + dir * (p.w * (prog - 0.5) * 0) - dir * 20, 3, 46);
        sfx.step(p.heavy);
      }
    }, frameMs);
    p.root.animate([
      { transform: 'translateY(0)' }, { transform: 'translateY(-3px)' }, { transform: 'translateY(0)' }
    ], { duration: frameMs * 2, iterations: Math.ceil(dur / (frameMs * 2)), easing: 'ease-in-out' });
    await anim(p.el, [
      { transform: `translateX(${p.x}px)` },
      { transform: `translateX(${target}px)` }
    ], dur, 'cubic-bezier(.2,.05,.8,.95)');
    clearInterval(stepper);
    p.setX(target);
    p.img.src = p.idle;
    p.face(1);
    sfx.thud(); dustAt(p.center(), 6);
    await anim(p.root, [{ transform: 'scaleY(0.95) scaleX(1.03)' }, { transform: 'none' }], 200, 'ease-out');
    p.clear(); p.setX(target);
    p.el.classList.add('idling');
  }

  /* the CAPTURE: attacker closes in, strikes, victim dies, attacker claims the square */
  async function capture(attacker, victim) {
    const dir = Math.sign(victim.center() - attacker.center()) || 1;
    const strikeX = victim.center() - (dir === 1 ? attacker.w + 40 : -40) + (dir === 1 ? 0 : 0);
    const approach = victim.center() - dir * (attacker.w / 2 + 130) - attacker.w / 2;

    setStatus(`${attacker.name} takes ${victim.name}`);
    // 1. march to striking range
    await walkBy(attacker, approach - attacker.x);

    attacker.el.classList.remove('idling');
    attacker.face(dir);
    camera.style.transformOrigin = `${(victim.center() / stageW()) * 100}% 70%`;

    // 2. ready + wind-up (held menace)
    attacker.img.src = attacker.attack[0];
    sfx.whoosh(0.18, 0.1);
    await sleep(220);
    attacker.img.src = attacker.attack[1];
    sfx.whoosh(0.3, 0.14);
    anim(attacker.el, [
      { transform: `translateX(${attacker.x}px)` },
      { transform: `translateX(${attacker.x - 18 * dir}px)` }
    ], 240, 'ease-out');
    await sleep(400);

    // 3. STRIKE — lunge in, impact on the victim
    attacker.img.src = attacker.attack[2];
    sfx.whoosh(0.15, 0.32);
    vignette.animate([
      { opacity: 0 }, { opacity: 0.55, offset: 0.3 }, { opacity: 0.5, offset: 0.7 }, { opacity: 0 }
    ], { duration: 900, easing: 'ease-out' });
    camera.animate([
      { transform: 'scale(1)' },
      { transform: 'scale(1.07)', offset: 0.3 },
      { transform: 'scale(1.07)', offset: 0.7 },
      { transform: 'scale(1)' }
    ], { duration: 900, easing: 'cubic-bezier(.2,.9,.3,1)' });
    anim(attacker.el, [
      { transform: `translateX(${attacker.x - 18 * dir}px)` },
      { transform: `translateX(${attacker.x + 80 * dir}px)` }
    ], 180, 'cubic-bezier(.3,.9,.3,1)');
    await sleep(120);
    // impact!
    sfx.clang(); sfx.thud(); shake(14, 330);
    dustAt(victim.center(), 10);
    victim.el.classList.remove('idling');
    victim.dead = true;
    victim.img.src = victim.death[0];
    victim.face(-dir); // struck from the attacker's side
    victim.root.animate([
      { filter: 'brightness(1)' },
      { filter: 'brightness(2.5) contrast(1.2)' },
      { filter: 'brightness(1)' }
    ], { duration: 200, easing: 'ease-out' });
    await sleep(140);

    // 4. follow-through held while the victim crumples
    attacker.img.src = attacker.attack[3];
    anim(attacker.el, [
      { transform: `translateX(${attacker.x + 80 * dir}px)` },
      { transform: `translateX(${attacker.x + 104 * dir}px)` }
    ], 150, 'ease-out');
    sfx.death();
    await sleep(380);
    victim.img.src = victim.death[1];
    await sleep(420);
    victim.img.src = victim.death[2];
    await sleep(240);
    victim.img.src = victim.death[3];
    sfx.bodyfall(); shake(9, 260); dustAt(victim.center(), 12);
    await sleep(700);

    // 5. attacker recovers; the fallen fade into embers
    attacker.img.src = attacker.idle;
    attacker.face(1);
    anim(attacker.el, [
      { transform: `translateX(${attacker.x + 104 * dir}px)` },
      { transform: `translateX(${attacker.x}px)` }
    ], 300, 'ease-in-out').then(() => { attacker.clear(); attacker.setX(attacker.x); attacker.el.classList.add('idling'); });
    embersAt(victim.center());
    await anim(victim.root, [
      { opacity: 1, filter: 'brightness(0.95)' },
      { opacity: 0.85, filter: 'brightness(0.75)', offset: 0.4 },
      { opacity: 0, filter: 'brightness(0.55)' }
    ], 1300, 'ease-in');
    setStatus(`${victim.name} has fallen`);
  }

  /* ---------------- build the two pieces ---------------- */
  const P = n => `pieces/${n}`;
  const pawn = makePiece({
    name: 'the pawn', w: 280, h: 410, startX: 110, heavy: false,
    idle: P('white-pawn.webp'),
    walk: [0,1,2,3].map(i => P(`white-pawn-walk-${i}.webp`)),
    attack: [0,1,2,3].map(i => P(`white-pawn-attack-${i}.webp`)),
    death: [0,1,2,3].map(i => P(`white-pawn-death-${i}.webp`))
  });
  const king = makePiece({
    name: 'the king', w: 330, h: 480, startX: 0, heavy: true,
    idle: P('white-king.webp'),
    walk: [0,1,2,3].map(i => P(`white-king-walk-${i}.webp`)),
    attack: [0,1,2,3].map(i => P(`white-king-attack-${i}.webp`)),
    death: [0,1,2,3].map(i => P(`white-king-death-${i}.webp`))
  });
  function placeKing() { king.setX(Math.max(500, stageW() - king.w - 110)); }
  placeKing();

  /* ---------------- controls ---------------- */
  let busy = false;
  const lock = on => { busy = on; buttons.forEach(b => { if (b.id !== 'btnReset') b.disabled = on; }); };
  const guard = async (fn, need) => {
    if (busy) return;
    if (need.some(p => p.dead)) return;
    lock(true);
    try { await fn(); } finally { lock(false); refreshButtons(); }
  };
  function refreshButtons() {
    $('btnPawnWalk').disabled = busy || pawn.dead;
    $('btnKingWalk').disabled = busy || king.dead;
    $('btnPawnTakes').disabled = busy || pawn.dead || king.dead;
    $('btnKingTakes').disabled = busy || pawn.dead || king.dead;
  }

  $('btnPawnWalk').onclick = () => guard(async () => {
    setStatus('the pawn advances');
    const dir = pawn.x + 400 < king.x || king.dead ? 1 : -1;
    await walkBy(pawn, 240 * dir);
    setStatus('idle');
  }, [pawn]);
  $('btnKingWalk').onclick = () => guard(async () => {
    setStatus('the king advances');
    const dir = king.x - 400 > pawn.x || pawn.dead ? -1 : 1;
    await walkBy(king, 240 * dir);
    setStatus('idle');
  }, [king]);
  $('btnPawnTakes').onclick = () => guard(() => capture(pawn, king), [pawn, king]);
  $('btnKingTakes').onclick = () => guard(() => capture(king, pawn), [pawn, king]);
  $('btnReset').onclick = () => {
    if (busy) return;
    for (const p of [pawn, king]) {
      p.clear();
      p.dead = false;
      p.img.src = p.idle;
      p.face(1);
      p.root.style.filter = '';
      p.el.classList.add('idling');
    }
    pawn.setX(110); placeKing();
    setStatus('two pieces, one square');
    refreshButtons();
  };
  refreshButtons();
})();
</script>
</body>
</html>
